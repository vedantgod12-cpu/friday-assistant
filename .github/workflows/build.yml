name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Download speech model
        run: |
          mkdir -p app/src/main/assets tmp
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q m.zip -d tmp
          mv tmp/* app/src/main/assets/model-en
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-en/uuid
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
